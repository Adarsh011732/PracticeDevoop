name: using-actions
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    # Set default working directory for all run steps to react-app
    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test -- --watchAll=false

      - name: Build Project
        run: npm run build
