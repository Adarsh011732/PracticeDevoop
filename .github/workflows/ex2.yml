name: PR_Gatekeeper
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
jobs:
    PR_Gatekeeper:
        runs-on: ubuntu-latest
        steps:
            - name: Print target branch 
              run: echo "PR is being merged into ${{github.base_ref}}"
            - name: Print PR number
              run: |
                echo "PR number is: ${{github.event.pull_request.number}}"
            - name: Complete checks
              run : echo "Gatekeeper check Completes"
